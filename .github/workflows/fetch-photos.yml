name: Fetch Missing Photos from Pexels

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC = 10:00 WIB
  workflow_dispatch:  # manual trigger via GitHub UI

jobs:
  fetch-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, zip, gd
          ini-values: memory_limit=256M

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Cache config
        run: php artisan config:cache

      - name: Fetch missing photos from Pexels
        run: php artisan photos:fetch-missing --limit=100 --sleep=3
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          APP_ENV: production
          APP_DEBUG: false
          DB_CONNECTION: sqlite
          DB_DATABASE: :memory:

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Fetch Missing Photos Failed',
              body: 'Workflow run failed: ' + context.runUrl
            })